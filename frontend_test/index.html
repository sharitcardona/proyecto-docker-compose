<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend Spring Boot</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header class="encabezado">
        <h1>Consumo API en Spring Boot Parcial</h1>
        <p>Grupo 16B · Docker Compose + CI/CD</p>
    </header>

    <main class="contenedor">

        <section class="tarjeta">
            <h2>Saludar</h2>
            <div class="botones">
                <button onclick="saludar()">Probar /saludar</button>
                <button onclick="saludando()">Probar /saludando</button>
                <button onclick="despliegue()">Probar /despliegue</button>
            </div>
            <p id="resultadoSaludo" class="resultado"></p>
        </section>

        <section class="tarjeta">
            <h2>Sumar dos números</h2>
            <div class="fila">
                <input type="number" id="numero1" placeholder="Número 1">
                <span class="signo">+</span>
                <input type="number" id="numero2" placeholder="Número 2">
                <button onclick="sumar()">Sumar</button>
            </div>
            <p id="resultadoSuma" class="resultado"></p>
        </section>

        <section class="tarjeta">
            <h2>Lista desde base de datos</h2>
            <button onclick="listar()">Consultar /lista</button>
            <ul id="listaDatos" class="lista"></ul>
        </section>

    </main>

    <footer class="pie">Uniempresarial · Despliegue Continuo</footer>

    <script src="js/app.js"></script>

</body>
</html>
