services:
  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: test
      MYSQL_USER: appuser
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    networks:
      - red-data
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    image: sharitcardona1/backend-spring-16b:latest 
    container_name: backend_spring
    ports:
      - "8091:8080"
    depends_on:
      mysql-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/test
      SPRING_DATASOURCE_USERNAME: appuser
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
    networks:
      - red-app
      - red-data
    restart: unless-stopped

  frontend:
    build: ./frontend_test
    container_name: frontend-html
    ports:
      - "8082:80"
    depends_on:
      - backend
    networks:
      - red-app
    restart: unless-stopped

networks:
  red-app:
    driver: bridge
  red-data:
    driver: bridge
    internal: true

volumes:
  mysql-data: